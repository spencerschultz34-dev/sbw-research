# Records earnings calls with our own pipeline (worker/): every 3 hours it reads the IR sites in
# worker/companies.json, and records, transcribes and stores any call that has happened but isn't stored yet.
# Pull requests and branch pushes that touch the pipeline get a dry run: find the latest webcast stream and record one minute.
name: Earnings calls

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      symbol: { description: 'Only this ticker (from worker/companies.json)', required: false }
      url: { description: 'Record this webcast or event page (needs symbol, year, quarter)', required: false }
      year: { description: 'Fiscal year, with url', required: false }
      quarter: { description: 'Fiscal quarter 1-4, with url', required: false }
      dry_run: { description: 'Only find the stream and record a minute', type: boolean, default: false }
  pull_request:
    paths: ['worker/**', 'api/ir.ts', 'lib/**', '.github/workflows/calls.yml']
  push:
    branches-ignore: [main]
    paths: ['worker/**', 'api/ir.ts', 'lib/**', '.github/workflows/calls.yml']

concurrency:
  group: earnings-calls-${{ (github.event_name == 'pull_request' || github.event_name == 'push') && github.ref || 'main' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  calls:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    defaults:
      run:
        working-directory: worker
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      ASSEMBLYAI_API_KEY: ${{ secrets.ASSEMBLYAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      WEBCAST_EMAIL: ${{ secrets.WEBCAST_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check

      - name: Dry run
        if: github.event_name == 'pull_request' || github.event_name == 'push' || inputs.dry_run
        env:
          SYMBOL: ${{ inputs.symbol }}
          DISCOVERY_DEBUG: 1
        run: node src/run.ts --dry-run ${SYMBOL:+--symbol "$SYMBOL"}

      - name: Record new calls
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && !inputs.dry_run && env.SUPABASE_SERVICE_ROLE_KEY != '' && env.ASSEMBLYAI_API_KEY != ''
        env:
          SYMBOL: ${{ inputs.symbol }}
          URL: ${{ inputs.url }}
          YEAR: ${{ inputs.year }}
          QUARTER: ${{ inputs.quarter }}
        run: node src/run.ts ${SYMBOL:+--symbol "$SYMBOL"} ${URL:+--url "$URL" --year "$YEAR" --quarter "$QUARTER"}

      - name: Not set up yet
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && !inputs.dry_run && (env.SUPABASE_SERVICE_ROLE_KEY == '' || env.ASSEMBLYAI_API_KEY == '')
        run: echo "::notice::Add the Supabase, S3 (R2) and AssemblyAI secrets in Settings → Secrets and variables → Actions to start recording calls."
